# Development iOS build — uses step-based eas/prebuild so post-prebuild
# install respects shouldUseFrozenLockfile (frozen for SDK 54).
# The legacy default builder hardcodes --no-frozen-lockfile after prebuild.
build:
  name: Stadium Edge development iOS (frozen lockfile)
  steps:
    - eas/checkout

    - run:
        name: Verify EAS_NO_FROZEN_LOCKFILE absent on EAS worker
        command: |
          if [ -n "${EAS_NO_FROZEN_LOCKFILE:-}" ]; then
            echo "ERROR: EAS_NO_FROZEN_LOCKFILE=${EAS_NO_FROZEN_LOCKFILE} on EAS worker"
            echo "Delete it from Expo project/account environment variables on expo.dev"
            exit 1
          fi
          echo "Confirmed: EAS_NO_FROZEN_LOCKFILE is absent on EAS worker"

    - eas/use_npm_token

    - eas/install_node_modules

    - eas/resolve_build_config

    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id_from_credentials

    - eas/prebuild:
        inputs:
          apple_team_id: ${ steps.resolve_apple_team_id_from_credentials.apple_team_id }

    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install

    - eas/configure_eas_update:
        inputs:
          throw_if_not_configured: false

    - eas/configure_ios_credentials

    - eas/configure_ios_version

    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }

    - eas/run_fastlane

    - eas/find_and_upload_build_artifacts
