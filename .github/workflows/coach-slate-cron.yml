name: Coach slate cron

on:
  schedule:
    # Every 2 minutes — keeps AI Coach precomputed slate warm 24/7.
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  coach-slate:
    runs-on: ubuntu-latest
    steps:
      - name: Run server slate pre-analysis
        env:
          COACH_SLATE_CRON_URL: ${{ secrets.COACH_SLATE_CRON_URL }}
          COACH_SLATE_CRON_KEY: ${{ secrets.COACH_SLATE_CRON_KEY }}
          PREBUILD_CRON_KEY: ${{ secrets.PREBUILD_CRON_KEY }}
          NOTIFY_CRON_KEY: ${{ secrets.NOTIFY_CRON_KEY }}
        run: |
          # Default host = current Render production API (not legacy Replit).
          URL="${COACH_SLATE_CRON_URL:-https://stadium-edge.onrender.com/api/coach/slate/cron}"
          KEY="${COACH_SLATE_CRON_KEY:-${PREBUILD_CRON_KEY:-${NOTIFY_CRON_KEY:-}}}"
          if [ -z "$KEY" ]; then
            echo "FAIL: No cron key configured."
            echo "Set GitHub secrets COACH_SLATE_CRON_KEY (or PREBUILD_CRON_KEY / NOTIFY_CRON_KEY)"
            echo "AND the matching env on Render so POST /api/coach/slate/cron does not return 503."
            echo "Silent success previously hid a broken slate refresh pipeline."
            exit 1
          fi
          echo "POST $URL"
          curl -fsS --max-time 300 -X POST -H "x-cron-key: $KEY" "$URL"
          echo
          echo "coach slate cron: done"
