name: Coach slate cron

# Production generation runs on a Render Cron Job (coachSlateWorker).
# This workflow verifies snapshot freshness on the public API and can optionally
# trigger the Render Cron Job via API (does not POST heavy work to the web dyno).

on:
  schedule:
    # Verify-only cadence (generation schedule lives on Render Cron Job).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      trigger_render_cron:
        description: "Also trigger Render Cron Job via API (cancels an active run)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  coach-slate-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production slate snapshot (read-only)
        env:
          COACH_SLATE_GET_URL: ${{ secrets.COACH_SLATE_GET_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_CRON_JOB_ID: ${{ secrets.RENDER_CRON_JOB_ID }}
          TRIGGER_RENDER: ${{ github.event.inputs.trigger_render_cron || 'false' }}
        run: |
          set -euo pipefail

          GET_URL="${COACH_SLATE_GET_URL:-https://stadium-edge.onrender.com/api/coach/slate}"
          HEALTH_URL="https://stadium-edge.onrender.com/api/healthz"

          echo "GET $HEALTH_URL"
          HEALTH_BODY="$(mktemp)"
          HEALTH_CODE=$(curl -sS --max-time 30 -o "$HEALTH_BODY" -w "%{http_code}" "$HEALTH_URL")
          echo "health_http=$HEALTH_CODE"
          if [ "$HEALTH_CODE" -lt 200 ] || [ "$HEALTH_CODE" -ge 300 ]; then
            echo "FAIL: healthz non-2xx"
            head -c 400 "$HEALTH_BODY" || true
            exit 1
          fi
          # Avoid dumping large HTML error pages into logs
          if head -c 16 "$HEALTH_BODY" | grep -qi '<!DOCTYPE\|<html'; then
            echo "FAIL: healthz returned HTML"
            exit 1
          fi

          if [ "$TRIGGER_RENDER" = "true" ]; then
            if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_CRON_JOB_ID:-}" ]; then
              echo "FAIL: RENDER_API_KEY and RENDER_CRON_JOB_ID required to trigger Render cron"
              exit 1
            fi
            echo "Triggering Render cron job $RENDER_CRON_JOB_ID"
            curl -sS --max-time 30 -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/cron-jobs/${RENDER_CRON_JOB_ID}/runs" \
              | head -c 800
            echo
            echo "Waiting 90s for worker progress before verify..."
            sleep 90
          fi

          echo "GET $GET_URL"
          BODY="$(mktemp)"
          CODE=$(curl -sS --max-time 30 -o "$BODY" -w "%{http_code}" "$GET_URL")
          echo "slate_http=$CODE bytes=$(wc -c < "$BODY" | tr -d ' ')"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "FAIL: slate GET non-2xx"
            if head -c 16 "$BODY" | grep -qi '<!DOCTYPE\|<html'; then
              echo "(HTML error page suppressed)"
            else
              head -c 400 "$BODY" || true
            fi
            exit 1
          fi
          if head -c 16 "$BODY" | grep -qi '<!DOCTYPE\|<html'; then
            echo "FAIL: slate GET returned HTML"
            exit 1
          fi

          python3 - "$BODY" <<'PY'
          import json, sys, time
          raw = open(sys.argv[1], "rb").read()
          data = json.loads(raw)
          if not isinstance(data, dict):
              print("FAIL: slate JSON root must be object")
              sys.exit(1)
          # Responsive API: body parsed. Snapshot may still be empty before first worker success.
          fresh = data.get("fresh")
          deep = data.get("deepSimComplete")
          refreshing = data.get("refreshing")
          computed = data.get("computedAt")
          sports = data.get("activeSports") or []
          has_snap = data.get("snapshot") is not None
          print("OK verify:", {
              "fresh": fresh,
              "deepSimComplete": deep,
              "refreshing": refreshing,
              "computedAt": computed,
              "activeSports": len(sports) if isinstance(sports, list) else sports,
              "hasSnapshot": has_snap,
          })
          # Incomplete must never look complete
          if has_snap and deep is False:
              print("FAIL: snapshot present with deepSimComplete=false")
              sys.exit(1)
          PY

          echo "coach slate verify: done"
