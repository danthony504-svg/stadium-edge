name: Rollback production OTA (embedded)

# FROZEN — blocked while .ota-production-freeze exists.
on:
  workflow_dispatch:
    inputs:
      message:
        description: Rollback message
        required: false
        default: "Emergency rollback to embedded bundle"
      runtime_version:
        description: Runtime version (must match installed app)
        required: false
        default: "1.0.0"

jobs:
  rollback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Production OTA freeze check
        run: bash scripts/check-ota-production-freeze.sh

      - name: Roll back production to embedded bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUNTIME_VERSION: ${{ github.event.inputs.runtime_version }}
        run: bash scripts/rollback-production-ota.sh "${{ github.event.inputs.message }}"
