name: Rollback production OTA (embedded)

# EMERGENCY: clears bad OTA by pointing the channel at the embedded binary bundle.
# Does NOT publish new JavaScript from HEAD (eas update:roll-back-to-embedded only).
# Not blocked by .ota-production-freeze — keep available while publishes are frozen.
# See artifacts/stadium-mobile/scripts/OTA_EMERGENCY_ROLLBACK.md

on:
  workflow_dispatch:
    inputs:
      message:
        description: Rollback message
        required: false
        default: "Emergency rollback to embedded bundle"
      runtime_version:
        description: Optional runtime override (blank = app.json, currently 1.1.0). Must match installed binary. Do not use 1.0.3 for 1.1.0 devices.
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "artifacts/stadium-mobile/.ota-rollback-embedded-trigger"

jobs:
  rollback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      # Same pnpm major as every other OTA workflow (version: 10) and lockfileVersion 9.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # eas-cli lives in the workspace; rollback script uses `pnpm exec eas`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Roll back production to embedded bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Blank → resolve from app.json (1.1.0). Explicit mismatch fails closed.
          RUNTIME_VERSION: ${{ github.event.inputs.runtime_version || '' }}
          OTA_MESSAGE: ${{ github.event.inputs.message || 'Emergency rollback to embedded — clear bad OTA on app.json runtime' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to repo secrets"
            exit 1
          fi
          # Guard: rollback script must only roll back to embedded (no new publish).
          if grep -nE 'update:roll-back-to-embedded' scripts/rollback-production-ota.sh >/dev/null \
            && ! grep -nE 'eas[[:space:]]+update[[:space:]]|publish-production-ota|publish-bootstrap|heal-production' scripts/rollback-production-ota.sh >/dev/null; then
            :
          else
            echo "FAIL: rollback script must not publish new JS"
            exit 1
          fi
          bash scripts/rollback-production-ota.sh "$OTA_MESSAGE"
