name: Referral rewards CI
on:
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/referral*"
      - "artifacts/api-server/src/routes/referrals.ts"
      - "artifacts/api-server/test/referral*"
      - "artifacts/api-server/test/register-hooks.mjs"
      - "artifacts/api-server/src/routes/account.ts"
      - "artifacts/stadium-mobile/**/referral*"
      - "artifacts/stadium-mobile/components/ReferralCard.tsx"
      - "artifacts/stadium-mobile/app/invite.tsx"
      - "artifacts/stadium-mobile/app/account.tsx"
      - "artifacts/stadium-mobile/lib/pendingSubscriptionIntent*"
      - "lib/db/**"
      - ".github/workflows/referrals-ci.yml"
jobs:
  referrals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: referral_test
          POSTGRES_PASSWORD: referral_test_only
          POSTGRES_DB: referral_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --import ./test/register-hooks.mjs --test test/referralPolicy.test.ts test/referralStore.integration.test.ts
        working-directory: artifacts/api-server
        env:
          TEST_DATABASE_URL: postgres://referral_test:referral_test_only@127.0.0.1:5432/referral_test
      - run: node --import ./test/register-hooks.mjs --test lib/referral.test.ts lib/accountHooksOrder.test.ts lib/accountScrollLayout.test.ts lib/pendingSubscriptionIntent.test.ts
        working-directory: artifacts/stadium-mobile
      - run: node build.mjs
        working-directory: artifacts/api-server
      - run: pnpm exec expo export --platform ios --output-dir /tmp/referral-ios
        working-directory: artifacts/stadium-mobile
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
