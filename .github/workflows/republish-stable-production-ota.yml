name: Republish stable production OTA

# Manual only — republish an explicitly chosen update group for app.json runtime
# (currently 1.1.0). Does not build new JS from HEAD; still requires critical tests
# + confirm so an untested group cannot be promoted silently.
# See artifacts/stadium-mobile/scripts/OTA_EMERGENCY_ROLLBACK.md
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type REPUBLISH_STABLE to republish an existing update group
        required: true
        default: ""
      message:
        description: Republish message
        required: false
        default: "ROLLBACK republish — manual only (set STABLE_UPDATE_GROUP)"
      update_group:
        description: Expo update group UUID to republish (required)
        required: true

jobs:
  republish:
    if: ${{ github.event.inputs.confirm_publish == 'REPUBLISH_STABLE' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Reliability critical tests (required)
        working-directory: ${{ github.workspace }}
        run: bash artifacts/stadium-mobile/scripts/run-reliability-critical-tests.sh

      - name: Republish OTA group to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_MESSAGE: ${{ github.event.inputs.message }}
          STABLE_UPDATE_GROUP: ${{ github.event.inputs.update_group }}
        run: |
          if [ -z "$STABLE_UPDATE_GROUP" ]; then
            echo "FAIL: update_group input is required"
            exit 1
          fi
          MSG="$OTA_MESSAGE"
          if [ -z "$MSG" ]; then
            MSG="ROLLBACK republish ${STABLE_UPDATE_GROUP} $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          bash scripts/republish-stable-production-ota.sh "$MSG"
