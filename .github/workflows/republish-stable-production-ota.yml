name: Republish stable production OTA

# Manual only — republish an explicitly chosen update group for app.json runtime
# (currently 1.1.0). Runtime mismatches fail closed in resolve-runtime-version.sh.
# Requires repo variable/secret STABLE_UPDATE_GROUP; no implicit known-good default.
on:
  workflow_dispatch:
    inputs:
      message:
        description: Republish message
        required: false
        default: "ROLLBACK republish — manual only (set STABLE_UPDATE_GROUP)"
      update_group:
        description: Expo update group UUID to republish (required)
        required: true

jobs:
  republish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Republish OTA group to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_MESSAGE: ${{ github.event.inputs.message }}
          STABLE_UPDATE_GROUP: ${{ github.event.inputs.update_group }}
        run: |
          if [ -z "$STABLE_UPDATE_GROUP" ]; then
            echo "FAIL: update_group input is required"
            exit 1
          fi
          MSG="$OTA_MESSAGE"
          if [ -z "$MSG" ]; then
            MSG="ROLLBACK republish ${STABLE_UPDATE_GROUP} $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          bash scripts/republish-stable-production-ota.sh "$MSG"
