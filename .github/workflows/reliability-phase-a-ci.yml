      - ".github/workflows/heal-production-ota.yml"
      - ".github/workflows/ota-test-*.yml"
      - ".github/workflows/republish-stable-production-ota.yml"

jobs:
  critical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reliability critical suite
        working-directory: ${{ github.workspace }}
        run: bash artifacts/stadium-mobile/scripts/run-reliability-critical-tests.sh
