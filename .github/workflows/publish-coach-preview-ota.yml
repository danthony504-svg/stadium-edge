name: Publish Coach preview OTA (Build 78 runtime)
on:
  push:
    branches: [codex/iphone-matchup-qa]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm preview publishing (never production)"
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
permissions:
  contents: read
  statuses: write
concurrency:
  group: coach-preview-ota
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview confirmation
        env:
          PREVIEW_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$PREVIEW_CONFIRM" != "PREVIEW_ONLY" ] && [ "$GITHUB_REF" != "refs/heads/codex/iphone-matchup-qa" ]; then
            echo "::error::Select PREVIEW_ONLY in Run workflow. No update was published."
            exit 1
          fi
      - name: Validate runtime and prevent production publishing
        run: |
          node -e 'const a=require("./app.json").expo;if(a.runtimeVersion!=="1.1.0")process.exit(1); console.log("PREVIEW ONLY — runtime 1.1.0")'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: Critical Coach and crash tests
        working-directory: ${{ github.workspace }}
        run: bash artifacts/stadium-mobile/scripts/run-reliability-critical-tests.sh
      - name: Verify iOS JS bundle
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_OTA_BOOTSTRAP: "true"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: pnpm exec expo export --platform ios --output-dir /tmp/coach-preview-export
      - name: Publish only to PREVIEW branch
        id: publish
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_OTA_BOOTSTRAP: "true"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN missing"; exit 1; }
          pnpm exec eas update --branch preview --platform ios --message "Coach QA preview ${{ github.sha }}" --non-interactive --json > /tmp/coach-preview-update.json
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/coach-preview-update.json", "utf8"));
          const rows = Array.isArray(payload) ? payload : [payload];
          const update = rows.find(row => row.platform === "ios" && row.runtimeVersion === "1.1.0");
          if (!update?.group || !/^[a-f0-9-]{36}$/i.test(update.group)) {
            throw Error("Unable to verify the iOS preview update group");
          }
          const config = require("./app.json").expo;
          const url = `https://expo.dev/accounts/${config.owner}/projects/${config.slug}/updates/${update.group}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `iOS preview runtime 1.1.0 · ${process.env.GITHUB_SHA}\n\n${url}\n`);
          NODE
      - name: Record preview result
        if: always() && github.ref == 'refs/heads/codex/iphone-matchup-qa'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const state = process.env.JOB_STATUS === 'success' && url ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state,
              context: 'iOS preview OTA',
              description: state === 'success' ? 'iOS preview published for runtime 1.1.0' : 'Preview publishing failed',
              target_url: url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
