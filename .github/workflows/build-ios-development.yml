name: Build iOS development

# Phase 1 — dev client for physical iPhone testing (OTA disabled).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: false
        default: "cursor/ota-redesign-e67e"
      message:
        description: EAS build message
        required: false
        default: "Development build — OTA off, device verification"
  push:
    branches:
      - cursor/ota-redesign-e67e

jobs:
  poll:
    if: contains(github.event.head_commit.message, '[poll-eas]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Poll EAS build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set -euo pipefail
          BUILD_ID="$(printf '%s' "${{ github.event.head_commit.message }}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="e9274882-ddc9-40c7-a09b-708b83ca5e46"
          fi
          echo "Polling EAS build $BUILD_ID"
          json="$(pnpm exec eas build:view "$BUILD_ID" --json)"
          printf '%s\n' "$json"
          pnpm exec eas build:view "$BUILD_ID"
          if [ -n "$workflow_run_id" ]; then
            echo "===== EAS workflow logs ($workflow_run_id) ====="
            pnpm exec eas workflow:logs "$workflow_run_id" --all-steps --non-interactive || true
          fi
          echo "===== EAS workflow logs (build id fallback) ====="
          pnpm exec eas workflow:logs "$BUILD_ID" --all-steps --non-interactive || true

  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-dev-build]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Print release checklist
        run: bash scripts/verify-stable-release.sh

      - name: Build iOS development client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set -euo pipefail

          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to repo secrets"
            exit 1
          fi

          bash scripts/ensure-eas-frozen-lockfile.sh --verify-json-only
          bash scripts/ensure-eas-frozen-lockfile.sh --remote-only

          unset EAS_NO_FROZEN_LOCKFILE

          if env | grep -q '^EAS_NO_FROZEN_LOCKFILE='; then
            echo "ERROR: EAS_NO_FROZEN_LOCKFILE is still present"
            env | grep '^EAS_NO_FROZEN_LOCKFILE=' || true
            exit 1
          fi
          echo "Confirmed: EAS_NO_FROZEN_LOCKFILE is absent"

          MSG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message || '' }}"
          if [ -z "$MSG" ]; then
            MSG="Development build $(git rev-parse --short HEAD)"
          fi

          env -u EAS_NO_FROZEN_LOCKFILE pnpm exec eas build \
            --platform ios \
            --profile development \
            --non-interactive \
            --refresh-ad-hoc-provisioning-profile \
            --wait \
            --message "$MSG"
