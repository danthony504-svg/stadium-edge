name: Build iOS development

# Phase 1 — dev client for physical iPhone testing (OTA disabled).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: false
        default: "cursor/ota-redesign-e67e"
      message:
        description: EAS build message
        required: false
        default: "Development build — OTA off, device verification"
  push:
    branches:
      - cursor/ota-redesign-e67e

jobs:
  poll:
    if: contains(github.event.head_commit.message, '[poll-eas]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Poll EAS build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set -euo pipefail
          BUILD_ID="$(printf '%s' "${{ github.event.head_commit.message }}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="e9274882-ddc9-40c7-a09b-708b83ca5e46"
          fi
          echo "Polling EAS build $BUILD_ID"
          json="$(pnpm exec eas build:view "$BUILD_ID" --json)"
          printf '%s\n' "$json"
          pnpm exec eas build:view "$BUILD_ID"
          echo "===== EAS worker log file(s) ====="
          LOG_URL="$(printf '%s' "$json" | node -e '
            const fs = require("fs");
            let data = {};
            try { data = JSON.parse(fs.readFileSync(0, "utf8")); } catch {}
            const url = data?.logFiles?.[0];
            if (url) process.stdout.write(url);
          ')"
          if [ -n "$LOG_URL" ]; then
            curl -sSL "$LOG_URL" -o /tmp/eas-build.log.bin
            echo "log file type: $(file -b /tmp/eas-build.log.bin)"
            python3 - <<'PY'
import base64, bz2, gzip, lzma, pathlib, zlib

raw = pathlib.Path("/tmp/eas-build.log.bin").read_bytes()
text = None
for name, fn in [
    ("raw-utf8", lambda b: b.decode("utf-8")),
    ("gzip", gzip.decompress),
    ("zlib", zlib.decompress),
    ("bz2", bz2.decompress),
    ("lzma", lzma.decompress),
]:
    try:
        out = fn(raw)
        if isinstance(out, bytes):
            out = out.decode("utf-8", errors="replace")
        text = out
        print(f"decoded via {name}, {len(text)} chars")
        break
    except Exception:
        pass

if text is None:
    print("could not decode log file")
else:
    pathlib.Path("/tmp/eas-build.log").write_text(text)
    for i, line in enumerate(text.splitlines(), 1):
        if any(k in line for k in ("error", "Error", "ERROR", "failed", "FAILED", "exit code", "CommandError")):
            print(f"{i}:{line}")
PY
            echo "===== base64 log (for offline decode) ====="
            base64 -w0 /tmp/eas-build.log.bin | head -c 200000; echo
          else
            echo "No logFiles URL in build:view JSON"
          fi
          echo "===== Expo GraphQL build details ====="
          curl -sS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query { app { byId(appId: \\\"9af36ab9-f953-4879-9dd2-82807ef7430c\\\") { buildById(buildId: \\\"$BUILD_ID\\\") { id status error { message errorCode } logFiles } } } }\"}" || true
          echo
          echo "===== EAS workflow logs ====="
          set +e
          pnpm exec eas workflow:runs --json --limit 20 > /tmp/workflow-runs.json 2>/tmp/workflow-runs.err
          echo "workflow:runs stderr:"; cat /tmp/workflow-runs.err
          echo "workflow:runs json (first 4000 chars):"; head -c 4000 /tmp/workflow-runs.json; echo
          WORKFLOW_RUN_ID="$(BUILD_ID="$BUILD_ID" node -e '
            const fs = require("fs");
            const target = process.env.BUILD_ID;
            let runs = [];
            try { runs = JSON.parse(fs.readFileSync("/tmp/workflow-runs.json", "utf8")); } catch {}
            const match = runs.find((run) => JSON.stringify(run).includes(target));
            if (match?.id) process.stdout.write(match.id);
          ')"
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            echo "Resolved workflow run $WORKFLOW_RUN_ID"
            pnpm exec eas workflow:logs "$WORKFLOW_RUN_ID" --all-steps --non-interactive
          else
            pnpm exec eas workflow:logs "$BUILD_ID" --all-steps --non-interactive
          fi
          set -e

  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-dev-build]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Print release checklist
        run: bash scripts/verify-stable-release.sh

      - name: Build iOS development client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          set -euo pipefail

          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to repo secrets"
            exit 1
          fi

          bash scripts/ensure-eas-frozen-lockfile.sh --verify-json-only
          bash scripts/ensure-eas-frozen-lockfile.sh --remote-only

          unset EAS_NO_FROZEN_LOCKFILE

          if env | grep -q '^EAS_NO_FROZEN_LOCKFILE='; then
            echo "ERROR: EAS_NO_FROZEN_LOCKFILE is still present"
            env | grep '^EAS_NO_FROZEN_LOCKFILE=' || true
            exit 1
          fi
          echo "Confirmed: EAS_NO_FROZEN_LOCKFILE is absent"

          MSG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message || '' }}"
          if [ -z "$MSG" ]; then
            MSG="Development build $(git rev-parse --short HEAD)"
          fi

          env -u EAS_NO_FROZEN_LOCKFILE pnpm exec eas build \
            --platform ios \
            --profile development \
            --non-interactive \
            --refresh-ad-hoc-provisioning-profile \
            --wait \
            --message "$MSG"
