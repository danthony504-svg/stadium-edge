name: Stadium Mobile Release Gate

on:
  push:
    branches: [main, release/**]
    paths:
      - "artifacts/stadium-mobile/**"
      - ".github/workflows/stadium-mobile-release-gate.yml"
      - ".github/workflows/publish-production-ota.yml"
  pull_request:
    paths:
      - "artifacts/stadium-mobile/**"
      - ".github/workflows/stadium-mobile-release-gate.yml"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Reject merge conflict markers
        run: |
          ! rg -n '^(<<<<<<<|=======|>>>>>>>)' app lib components

      - name: TypeScript
        run: pnpm typecheck

      - name: Deterministic tests
        run: pnpm test

      - name: iOS Metro bundle
        run: pnpm exec expo export --platform ios --output-dir /tmp/stadium-mobile-bundle
