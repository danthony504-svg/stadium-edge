name: Promote preview OTA to production

# FROZEN: blocked until .ota-phase2-verified exists in repo (Phase 2 complete).
on:
  workflow_dispatch:
    inputs:
      preview_update_group:
        description: Preview update group UUID (from eas update:list on preview)
        required: true
      rollout_percentage:
        description: Staged rollout percentage (1-100)
        required: false
        default: "10"
      message:
        description: Promotion message
        required: false
        default: "Promote tested preview OTA to production"
      confirm_phase2_complete:
        description: Type PHASE2_COMPLETE to confirm all Phase 2 steps passed on device
        required: true

jobs:
  promote:
    if: ${{ github.event.inputs.confirm_phase2_complete == 'PHASE2_COMPLETE' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Require Phase 2 sign-off marker
        run: |
          if [ ! -f "${{ github.workspace }}/.ota-phase2-verified" ]; then
            echo "Missing .ota-phase2-verified in repo root."
            echo "Complete Phase 2 on device, then commit the marker file."
            bash scripts/verify-testing-phases.sh 2
            exit 1
          fi

      - name: Print verification gate
        run: OTA_CHANNEL=production bash scripts/verify-ota-candidate.sh

      - name: Promote preview group to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_UPDATE_GROUP: ${{ github.event.inputs.preview_update_group }}
          ROLLOUT_PERCENTAGE: ${{ github.event.inputs.rollout_percentage }}
        run: |
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="PROMOTE ${{ github.event.inputs.preview_update_group }} @ ${{ github.event.inputs.rollout_percentage }}%"
          fi
          bash scripts/promote-preview-to-production.sh "$MSG"
