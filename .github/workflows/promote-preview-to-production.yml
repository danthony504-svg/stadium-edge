name: Promote preview OTA to production

# FROZEN — blocked while .ota-production-freeze exists.
on:
  workflow_dispatch:
    inputs:
      preview_update_group:
        description: Preview update group UUID (from eas update:list on preview)
        required: true
      rollout_percentage:
        description: Staged rollout percentage (1-100)
        required: false
        default: "10"
      message:
        description: Promotion message
        required: false
        default: "BLOCKED — TestFlight must pass first"

jobs:
  promote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Production OTA freeze check
        run: bash scripts/check-ota-production-freeze.sh

      - name: Promote preview group to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_UPDATE_GROUP: ${{ github.event.inputs.preview_update_group }}
          ROLLOUT_PERCENTAGE: ${{ github.event.inputs.rollout_percentage }}
        run: |
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="PROMOTE ${{ github.event.inputs.preview_update_group }} @ ${{ github.event.inputs.rollout_percentage }}%"
          fi
          bash scripts/promote-preview-to-production.sh "$MSG"
