name: Publish production OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: OTA update message
        required: false
        default: "Production JavaScript OTA"
      embedded_build_id:
        description: EAS build ID of the compatible embedded App Review binary
        required: true

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/release/stadium-edge-stabilization' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      # pnpm version is pinned once in the root packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Run deterministic release gate
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          EXPO_PUBLIC_DEPLOY_MESSAGE: DEPLOY-VERIFY ${{ github.sha }}-${{ github.run_id }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm exec expo export --platform ios --output-dir /tmp/expo-ota-check

      - name: Publish OTA to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          EXPO_PUBLIC_DEPLOY_MESSAGE: DEPLOY-VERIFY ${{ github.sha }}-${{ github.run_id }}
          EMBEDDED_BUILD_ID: ${{ github.event.inputs.embedded_build_id }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to repo secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="DEPLOY-VERIFY $(git rev-parse HEAD) $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          bash scripts/publish-production-ota.sh "$MSG"
