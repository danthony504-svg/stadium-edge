name: Publish production OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: OTA update message
        required: false
        default: "Production JavaScript OTA"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/stadium-edge-stabilization
          fetch-depth: 0

      # pnpm version is pinned once in the root packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Verify checked-out release
        id: release
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin release/stadium-edge-stabilization
          git checkout --force -B release/stadium-edge-stabilization origin/release/stadium-edge-stabilization
          RELEASE_HEAD="$(git rev-parse origin/release/stadium-edge-stabilization)"
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          echo "Release HEAD: $CHECKED_OUT_HEAD"
          if [ "$CHECKED_OUT_HEAD" != "$RELEASE_HEAD" ]; then
            echo "Refusing OTA publish: checkout does not match origin/release/stadium-edge-stabilization."
            exit 1
          fi
          echo "sha=$CHECKED_OUT_HEAD" >> "$GITHUB_OUTPUT"

      - name: Publish OTA through guarded release command
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EMBEDDED_BUILD_ID: ${{ secrets.EMBEDDED_BUILD_ID }}
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_GIT_COMMIT: ${{ steps.release.outputs.sha }}
          EXPO_PUBLIC_DEPLOY_MESSAGE: DEPLOY-VERIFY ${{ steps.release.outputs.sha }}-${{ github.run_id }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          if [ -z "$EMBEDDED_BUILD_ID" ]; then
            echo "EMBEDDED_BUILD_ID repository secret is required."
            exit 1
          fi
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="DEPLOY-VERIFY $(git rev-parse HEAD) $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          npm run update:ios -- "$MSG"
