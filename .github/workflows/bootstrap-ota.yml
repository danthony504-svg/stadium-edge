name: Bootstrap OTA

# Publishes NEW production JS — gated. No push auto-publish.
# Emergency without new JS: use rollback-production-ota (embedded only).
# See artifacts/stadium-mobile/scripts/OTA_EMERGENCY_ROLLBACK.md

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLISH_NEW_OTA to allow publishing new production JS
        required: true
        default: ""

jobs:
  publish:
    if: ${{ github.event.inputs.confirm_publish == 'PUBLISH_NEW_OTA' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Reliability critical tests (required)
        working-directory: ${{ github.workspace }}
        run: bash artifacts/stadium-mobile/scripts/run-reliability-critical-tests.sh

      - name: Verify bootstrap bundle compiles
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_OTA_BOOTSTRAP: "true"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          EXPO_PUBLIC_DEPLOY_MESSAGE: BOOTSTRAP OTA ${{ github.sha }}
        run: pnpm exec expo export --platform ios --output-dir /tmp/expo-bootstrap-check

      - name: Publish bootstrap OTA to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_OTA_BOOTSTRAP: "true"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: bash scripts/publish-bootstrap-ota.sh
