name: OTA TEST 002

# Publishes NEW production JS — gated. No push auto-publish.

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLISH_NEW_OTA to allow publishing new production JS
        required: true
        default: ""

jobs:
  publish:
    if: ${{ github.event.inputs.confirm_publish == 'PUBLISH_NEW_OTA' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/stadium-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Reliability critical tests (required)
        working-directory: ${{ github.workspace }}
        run: bash artifacts/stadium-mobile/scripts/run-reliability-critical-tests.sh

      - name: Pre-publish check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/pre-publish-ota-check.sh

      - name: Verify bundle compiles
        env:
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: pnpm exec expo export --platform ios --output-dir /tmp/expo-ota-test-002

      - name: Publish OTA TEST 002
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: stadium-edge.onrender.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvZm91bmQtcmFwdG9yLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_APP_REVIEW_MODE: "false"
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: bash scripts/publish-ota-test-002.sh
